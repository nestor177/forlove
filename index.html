[1,"e","Which is the accounting equation?",["Assets = Liabilities + Equity","Assets = Liabilities − Equity","Assets + Liabilities = Equity","Equity = Assets + Liabilities"],"Everything the company has (assets) is financed either by outsiders (liabilities) or by the owners (equity)."],
[1,"e","Financial accounting reports to…",["Both external and internal users","Only internal managers","Only the tax office","Only the CEO"],"Financial accounting serves external users (investors, banks, the state) and internal users. Management accounting is internal only."],
[1,"e","Since which year must all EU listed companies apply IFRS?",["2005","1973","2015","2027"],"IAS/IFRS exist since 1973, but they became compulsory for all EU listed companies in 2005."],

[1,"e","Which is a FUNDAMENTAL qualitative characteristic?",["Relevance","Comparability","Timeliness","Understandability"],"Fundamental: relevance and faithful representation. The others are enhancing characteristics."],
[1,"e","Shareholders of a corporation are…",["Not personally liable for the company's debts","Personally liable for all debts","Liable only for unpaid taxes","Liable for employees' private debts"],"In a corporation the owners are not personally liable. A sole proprietor is."],
[1,"e","The cash flow statement groups cash flows into…",["Operating, investing and financing","Current and non-current","Revenue, expense and profit","Assets, liabilities and equity"],"Three activities: operating (daily business), investing (long-term assets), financing (loans, shares, dividends)."],
/* Ch 1 — hard */
[1,"h","Which is an ENHANCING qualitative characteristic?",["Verifiability","Relevance","Faithful representation","Going concern"],"Enhancing: comparability, verifiability, timeliness, understandability. Going concern is an assumption."],
[1,"h","The going concern assumption means that…",["The entity will keep operating in the foreseeable future","Assets are shown at liquidation values","The company must make a profit every year","Only cash transactions are recorded"],"We assume the business continues. If not, a different basis of measurement would be needed."],

/* Ch 1 — pro */
[1,"p","Which classification is fully correct?",["Fundamental: relevance, faithful representation. Enhancing: comparability, verifiability, timeliness, understandability","Fundamental: comparability, relevance. Enhancing: timeliness, verifiability, faithful representation","Fundamental: going concern, accrual. Enhancing: relevance, comparability","Fundamental: understandability, relevance. Enhancing: cost, timeliness"],"Two fundamental, four enhancing. Cost is a constraint; accrual and going concern are assumptions."],
[1,"p","Which item does NOT belong in the income statement?",["Dividends paid","Salary expense","Interest expense","Income tax expense"],"Dividends go to the statement of changes in equity, reducing retained earnings."],

[1,"p","The cost constraint in the conceptual framework means…",["The benefits of reporting information should justify its cost","Companies must report at the lowest possible cost","All assets are measured at historical cost","Expenses must be minimised"],"Information is only worth reporting if its usefulness outweighs the cost of producing it."],
[1,"p","Cash fell from €30,000 to €18,000, while revenue was €135,000 and expenses were €72,000. Net income is…",["€63,000","−€12,000","€135,000","€51,000"],"Net income = 135,000 − 72,000 = €63,000. The change in cash is a distractor: net income ≠ change in cash."],

[2,"e","Where is a transaction recorded FIRST?",["Journal","Ledger","Trial balance","Balance sheet"],"The journal is the 'book of original entry'. Then: ledger → trial balance → statements."],
[2,"e","'Debit' means…",["The left side of an account","The right side of an account","Always an increase","Always a decrease"],"Debit = left, credit = right. Whether it increases or decreases depends on the account type."],
[2,"e","Which accounts INCREASE with a debit?",["Assets and expenses","Liabilities and revenue","Equity and revenue","Liabilities and equity"],"Assets, expenses (and dividends) increase on the debit side."],

[2,"h","Paid a supplier for goods bought earlier on account. The entry is…",["Dr Accounts payable / Cr Cash","Dr Cash / Cr Accounts payable","Dr Inventory / Cr Cash","Dr Expense / Cr Cash"],"Debt ↓ (debit payable), cash ↓ (credit cash)."],

[2,"p","A €2,000 payment to a supplier was recorded as Dr Cash / Cr Accounts payable. What is the result?",["Cash and accounts payable are both overstated by €4,000, but the trial balance still balances","The trial balance will not balance","Only cash is wrong, by €2,000","Nothing is wrong, the sides are just swapped"],"Correct entry: Dr AP / Cr Cash. The reversed entry adds 2,000 instead of subtracting 2,000, so each account is off by 4,000. Debits still equal credits."],

function endMsg(s){if(s>=18)return"Ларочка, ты гений! Экзамен уже твой";if(s>=14)return"Умничка, солнышко! Ещё чуть-чуть, и будет идеально";if(s>=10)return"Хорошо, Ларочка! Каждый тест делает тебя сильнее";return"Ларочка, всё выйдет! Давай ещё разок, я в тебя верю"}
let lastMsg="";const say=a=>{let m;do{m=pick(a)}while(m===lastMsg&&a.length>1);lastMsg=m;return m};

const LV={
 e:{tab:"Простой",title:"Easy",desc:"Definitions, account types and simple calculations from every chapter."},
 h:{tab:"Сложный",title:"Hard",desc:"Journal entries, adjustments, bad debts, COGS and depreciation with new numbers each time."},
 p:{tab:"Для профи (выеби)",title:"Pro",desc:"Exam-level problems: DDB, disposals with partial years, FIFO and average cost, allowances, notes and estimate revisions."}
};

const BL={
 a:{tab:"Ch. 1–3",chs:[1,2,3]},
 b:{tab:"Ch. 4",chs:[4]},
 c:{tab:"Ch. 5",chs:[5]},
 d:{tab:"Ch. 6–7",chs:[6,7]},
 x:{tab:"Exam simulation",chs:[1,2,3,4,5,6,7],mix:true}
};

/* ---------- test builder: questions she has already seen go to the back of the queue ---------- */
const SID=S.map((s,i)=>({s,id:i}));
let seen=new Set();try{seen=new Set(JSON.parse(localStorage.getItem("lq-seen")||"[]"))}catch(e){}
const saveSeen=()=>{try{localStorage.setItem("lq-seen",JSON.stringify([...seen]))}catch(e){}};
const unseenIn=chs=>SID.filter(x=>chs.includes(x.s[0])&&!seen.has(x.id)).length;
function queue(chs,lv){
 const lvls=[lv,...{e:["h","p"],h:["e","p"],p:["h","e"]}[lv]],q={};
 for(const c of chs){
  const st_=SID.filter(x=>x.s[0]===c),gen=G.filter(g=>g.ch===c);
  const fresh=l=>shuffle([...st_.filter(x=>x.s[1]===l&&!seen.has(x.id)),...gen.filter(g=>g.l===l).map(g=>({g}))]);
  const old=l=>shuffle(st_.filter(x=>x.s[1]===l&&seen.has(x.id)));
  q[c]=[...lvls.flatMap(fresh),...lvls.flatMap(old),...shuffle(gen.map(g=>({g}))),...shuffle(gen.map(g=>({g})))];
 }
 return q;
}
function take(chs,lv,n,taken){
 const q=queue(chs,lv),out=[],order=shuffle(chs);let guard=0;
 while(out.length<n&&guard<100){for(const c of order){if(out.length>=n)break;while(q[c].length){const it=q[c].shift();if(it.id!==undefined){if(taken.has(it.id))continue;taken.add(it.id)}out.push({c,...it});break}}guard++}
 return out;
}
function build(){
 const b=BL[st.block],taken=new Set();
 const picked=b.mix?[...take(b.chs,"e",6,taken),...take(b.chs,"h",8,taken),...take(b.chs,"p",6,taken)]:take(b.chs,st.lv,20,taken);
 taken.forEach(id=>seen.add(id));
 if(unseenIn(b.chs)<8)SID.filter(x=>b.chs.includes(x.s[0])&&!taken.has(x.id)).forEach(x=>seen.delete(x.id));
 saveSeen();
 return shuffle(picked).map(it=>{
  let q,o,ex;
  if(it.s){q=it.s[2];o=it.s[3];ex=it.s[4]}else{const r=it.g.f();q=r.q;o=r.o;ex=r.ex}
  const order=shuffle([0,1,2,3].slice(0,o.length));
  return{ch:it.c,q,o:order.map(i=>o[i]),c:order.indexOf(0),ex,pick:null};
 });
}

/* ---------- state & render ---------- */
let st={screen:"home",lv:"e",block:"a",qs:[],i:0};
try{const s=localStorage.getItem("lq-level");if(s&&LV[s])st.lv=s;const b=localStorage.getItem("lq-block");if(b&&BL[b])st.block=b}catch(e){}
const label=()=>BL[st.block].mix?"Exam simulation · mixed levels":`${BL[st.block].tab} · ${LV[st.lv].tab}`;
const app=document.getElementById("app");

function home(){
 app.innerHTML=`
 <div class="welcome" style="display:flex;flex-direction:column;gap:14px">
  <div class="eyebrow">Financial Accounting I · Chapters 1–7</div>
  <h1>Привет, самая умная <em>девочка в мире</em></h1>
  <p class="lead">Every test is 20 questions from all seven chapters. The questions are mixed and the numbers change every time, so no two tests are the same.</p>
 </div>
 <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">1 · Choose chapters</span>
 <div class="tabs" role="tablist">${Object.entries(BL).map(([k,v])=>`<button class="tab" role="tab" id="blk-${k}" aria-selected="${k===st.block}" data-bl="${k}">${v.tab}</button>`).join("")}</div></div>
 ${BL[st.block].mix?"":`<div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">2 · Choose level</span>
 <div class="tabs" role="tablist">${Object.entries(LV).map(([k,v])=>`<button class="tab" role="tab" id="tab-${k}" aria-selected="${k===st.lv}" data-lv="${k}">${v.tab}</button>`).join("")}</div></div>`}
 <div class="levelcard">
  <p>${BL[st.block].mix?"Like the real exam: 20 questions from all seven chapters — 6 easy, 8 hard and 6 pro.":LV[st.lv].desc}</p>
  <div class="meta"><span>20 questions</span><span>${BL[st.block].chs.length===1?"Chapter "+BL[st.block].chs[0]:"Chapters "+BL[st.block].chs[0]+"–"+BL[st.block].chs.at(-1)}</span><span>${unseenIn(BL[st.block].chs)} questions she hasn't seen yet</span></div>
  <div class="row"><button class="btn" id="start">Start test</button><span class="hint">Keys 1–4 to answer, Enter for next</span></div>
 </div>
 <div class="chapters">${Object.entries(CH).filter(([k])=>BL[st.block].chs.includes(+k)).map(([k,v])=>`<div><span>${k}</span>${v}</div>`).join("")}</div>`;
 app.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{st.lv=b.dataset.lv;try{localStorage.setItem("lq-level",st.lv)}catch(e){}home()});
 app.querySelectorAll("[data-bl]").forEach(b=>b.onclick=()=>{st.block=b.dataset.bl;try{localStorage.setItem("lq-block",st.block)}catch(e){}home()});
 document.getElementById("start").onclick=start;
}
function start(){st.qs=build();st.i=0;st.screen="quiz";quiz();window.scrollTo({top:0})}

function ledger(){return`<div class="ledger" aria-hidden="true">${st.qs.map((q,i)=>`<i class="${q.pick===null?(i===st.i?"now":""):(q.pick===q.c?"ok":"no")}"></i>`).join("")}</div>`}
function quiz(fb){
 const q=st.qs[st.i],ok=st.qs.filter(x=>x.pick!==null&&x.pick===x.c).length,bad=st.qs.filter(x=>x.pick!==null&&x.pick!==x.c).length,answered=q.pick!==null;
 app.innerHTML=`
 <div class="top"><span class="eyebrow">${label()}</span><button class="linkbtn" id="exit">Exit test</button></div>
 ${ledger()}
 <div class="qhead"><span>Question ${String(st.i+1).padStart(2,"0")} / 20 · Ch. ${q.ch} ${CH[q.ch]}</span><span>✓ ${ok} · ✗ ${bad}</span></div>
 <p class="qtext">${esc(q.q)}</p>
 <div class="opts">${q.o.map((t,i)=>{let cls="opt";if(answered){if(i===q.c)cls+=" right";else if(i===q.pick)cls+=" wrong";else cls+=" dim"}return`<button class="${cls}" id="opt-${i}" data-i="${i}" ${answered?"disabled":""}><span class="k">${"ABCD"[i]}</span><span class="t">${esc(t)}</span></button>`}).join("")}</div>
 ${answered?`<div class="feedback" aria-live="polite"><p class="cheer">${esc(fb||q.msg||"")}</p><p class="ex"><b>${q.pick===q.c?"Correct.":"Correct answer: "+esc(q.o[q.c])+"."}</b> ${esc(q.ex)}</p><div class="row"><button class="btn" id="next">${st.i<19?"Next question":"See result"}</button></div></div>`:""}`;
 document.getElementById("exit").onclick=()=>{st.screen="home";home()};
 app.querySelectorAll(".opt").forEach(b=>b.onclick=e=>answer(+b.dataset.i,b));
 const nx=document.getElementById("next");if(nx){nx.onclick=next;nx.focus({preventScroll:true})}
}
function answer(i,el){
 const q=st.qs[st.i];if(q.pick!==null)return;q.pick=i;
 const right=i===q.c;q.msg=right?say(YES):say(NO);
 let rect=el.getBoundingClientRect();
 quiz(q.msg);
 if(right){const b=document.getElementById("opt-"+i);if(b)rect=b.getBoundingClientRect();burst(rect.left+rect.width/2,rect.top+rect.height/2)}
}
function next(){if(st.i<19){st.i++;quiz();const t=document.querySelector(".qtext");if(t)t.scrollIntoView({block:"nearest"})}else{st.screen="done";done()}}
function done(){
 const s=st.qs.filter(q=>q.pick===q.c).length,wrong=st.qs.filter(q=>q.pick!==q.c);
 app.innerHTML=`
 <div class="eyebrow">${label()} · result</div>
 ${ledger()}
 <div style="display:flex;flex-direction:column;gap:10px"><div class="score">${s} / 20</div><p class="cheer">${endMsg(s)}</p></div>
 <div class="row"><button class="btn" id="again">Same test, new questions</button><button class="btn ghost" id="lvl">Other chapters or level</button></div>
 ${wrong.length?`<div class="eyebrow">Review your mistakes</div><div class="review">${wrong.map(q=>`<div class="rv"><span class="rq">${esc(q.q)}</span><span class="ry">${esc(q.o[q.pick])}</span><span class="rc"><b>${esc(q.o[q.c])}</b></span><span class="rx">${esc(q.ex)}</span></div>`).join("")}</div>`:`<p class="lead">No mistakes at all. Perfect ledger.</p>`}`;
 document.getElementById("again").onclick=start;
 document.getElementById("lvl").onclick=()=>{st.screen="home";home()};
 if(s>=14){setTimeout(()=>{const el=document.querySelector(".score");if(el){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,80)}},150)}
 window.scrollTo({top:0});
}

document.addEventListener("keydown",e=>{
 if(st.screen!=="quiz")return;const q=st.qs[st.i];
 const k=e.key.toLowerCase(),map={"1":0,"2":1,"3":2,"4":3,a:0,b:1,c:2,d:3};
 if(q.pick===null&&k in map&&map[k]<q.o.length){const el=document.getElementById("opt-"+map[k]);if(el)answer(map[k],el)}
 else if(q.pick!==null&&e.key==="Enter"&&document.activeElement?.id!=="next"){e.preventDefault();next()}
});

/* ---------- hearts with gravity ---------- */
const cv=document.getElementById("fx"),cx=cv.getContext("2d");let parts=[],raf=0;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const HC=["#e11d48","#f43f5e","#be123c","#fb7185","#ff4d6d"];
function size(){const d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
size();addEventListener("resize",size);
function burst(x,y,n){n=n||(reduce?8:48);for(let k=0;k<n;k++){const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.1,sp=reduce?0:5+Math.random()*11;
 parts.push({x:x+(reduce?(Math.random()-.5)*160:0),y:y+(reduce?(Math.random()-.5)*60:0),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:reduce?0:.38,r:(Math.random()-.5)*.8,vr:(Math.random()-.5)*.25,s:10+Math.random()*18,life:0,max:(reduce?60:90)+Math.random()*70,c:pick(HC)})}
 if(!raf)raf=requestAnimationFrame(tick)}
function heart(s){cx.beginPath();cx.moveTo(0,-s*.2);cx.bezierCurveTo(0,-s*.5,-s*.5,-s*.5,-s*.5,-s*.2);cx.bezierCurveTo(-s*.5,s*.1,0,s*.3,0,s*.5);cx.bezierCurveTo(0,s*.3,s*.5,s*.1,s*.5,-s*.2);cx.bezierCurveTo(s*.5,-s*.5,0,-s*.5,0,-s*.2);cx.closePath();cx.fill()}
function tick(){cx.clearRect(0,0,cv.width,cv.height);
 parts=parts.filter(p=>p.life<p.max&&p.y<innerHeight+60);
 for(const p of parts){p.vy+=p.g;p.vx*=.985;p.vy*=.995;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
  const fade=Math.min(1,Math.max(0,1-(p.life-p.max*.55)/(p.max*.45)));cx.save();cx.globalAlpha=fade;cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;heart(p.s);cx.restore()}
 raf=parts.length?requestAnimationFrame(tick):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}

/* ---------- boot (keeps progress across page updates) ---------- */
function boot(data){
 if(data&&data.st&&data.st.qs){st=data.st}
 if(st.screen==="quiz"&&st.qs.length){const q=st.qs[st.i];quiz(q.pick!==null?q.msg:undefined)}
 else if(st.screen==="done"&&st.qs.length)done();else home();
}
window.claude?.hot?.snapshot?.(()=>({st}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
